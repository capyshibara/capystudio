<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Video Editor · CapyStudio</title>
<meta name="description" content="Merge phone videos, add music and text, and export — privately in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="./css/style.css">
</head>
<body class="editor">
<header class="editor-header">
  <a class="back-link" href="./" aria-label="Back to CapyStudio home">‹</a>
  <div class="project-heading">
    <span class="wordmark">CapyStudio</span>
    <input id="project-title" value="Untitled video" aria-label="Project title">
  </div>
  <div class="header-actions">
    <span class="privacy-pill" title="Your media stays on this device"><span aria-hidden="true">●</span> On-device</span>
    <button id="save-project" class="quiet" title="Save editable project">Save</button>
    <button id="load-project-btn" class="quiet" title="Load editable project">Open</button>
    <input type="file" id="load-project" accept=".json,.capy.json" hidden>
    <button id="export-video" class="primary export-button"><span aria-hidden="true">↑</span> Export</button>
  </div>
</header>

<main class="editor-main">
  <section class="preview-panel" aria-label="Video preview">
    <div class="stage-meta">
      <span id="format-label">9:16 · 1080p</span>
      <button id="stage-add" class="quiet compact">+ Add media</button>
    </div>
    <div class="preview-wrap" id="preview-wrap">
      <canvas id="preview"></canvas>
      <button id="empty-add" class="empty-stage-action">
        <span class="empty-stage-icon" aria-hidden="true">＋</span>
        <strong>Add videos or photos</strong>
        <small>Select several from your phone at once</small>
      </button>
    </div>
    <div class="transport" aria-label="Playback controls">
      <button id="play-toggle" class="play-toggle" aria-label="Play"><span aria-hidden="true">▶</span></button>
      <span id="current-time" class="timecode">00:00.0</span>
      <input id="scrubber" type="range" min="0" max="0" step="0.01" value="0" aria-label="Timeline position">
      <span id="duration-time" class="timecode muted">00:00.0</span>
      <button id="undo" class="quiet icon-button" title="Undo" aria-label="Undo" disabled>↶</button>
      <button id="redo" class="quiet icon-button" title="Redo" aria-label="Redo" disabled>↷</button>
    </div>
  </section>

  <section class="timeline-panel" aria-label="Timeline">
    <div class="timeline-header">
      <div>
        <strong>Timeline</strong>
        <span id="timeline-summary">Add clips to start your story</span>
      </div>
      <label class="zoom-control" title="Timeline zoom">−
        <input id="timeline-zoom" type="range" min="18" max="80" value="36" aria-label="Timeline zoom">
        +
      </label>
    </div>
    <div id="timeline-scroll" class="timeline-scroll">
      <div id="timeline-content" class="timeline-content">
        <div id="timeline-ruler" class="timeline-ruler" aria-hidden="true"></div>
        <div class="track-row video-row">
          <span class="track-label"><b aria-hidden="true">▣</b> Video</span>
          <div id="video-track" class="track-lane"></div>
        </div>
        <div class="track-row text-row">
          <span class="track-label"><b aria-hidden="true">T</b> Text</span>
          <div id="text-track" class="track-lane"></div>
        </div>
        <div class="track-row audio-row">
          <span class="track-label"><b aria-hidden="true">♫</b> Audio</span>
          <div id="audio-track" class="track-lane"></div>
        </div>
        <div id="timeline-playhead" class="timeline-playhead" aria-hidden="true"><span></span></div>
      </div>
    </div>
  </section>

  <aside id="inspector" class="inspector-panel open" aria-label="Editing tools">
    <div class="inspector-top">
      <div>
        <span class="eyebrow">Tools</span>
        <h2 id="inspector-title">Media</h2>
      </div>
      <button id="close-inspector" class="quiet icon-button" aria-label="Close tools">⌄</button>
    </div>
    <div id="inspector-content" class="inspector-content"></div>
    <nav class="tool-dock" aria-label="Editor tools">
      <button class="tool-button active" data-tool="media"><span aria-hidden="true">▣</span><small>Media</small></button>
      <button class="tool-button" data-tool="edit"><span aria-hidden="true">✂</span><small>Edit</small></button>
      <button class="tool-button" data-tool="audio"><span aria-hidden="true">♫</span><small>Audio</small></button>
      <button class="tool-button" data-tool="text"><span aria-hidden="true">T</span><small>Text</small></button>
      <button class="tool-button" data-tool="canvas"><span aria-hidden="true">▱</span><small>Canvas</small></button>
    </nav>
  </aside>
</main>

<input id="video-input" type="file" accept="video/*,image/*" multiple hidden>
<input id="audio-input" type="file" accept="audio/*" multiple hidden>

<div id="export-overlay" class="overlay" hidden>
  <div class="overlay-box export-card">
    <div class="export-orbit" aria-hidden="true">↑</div>
    <h2>Creating your video</h2>
    <p id="export-detail">Rendering the timeline in real time. Keep this tab visible.</p>
    <progress id="export-progress" max="1" value="0"></progress>
    <div class="export-progress-row">
      <span id="export-pct">0%</span>
      <span id="export-remaining">Starting…</span>
    </div>
    <button id="export-cancel" class="quiet">Cancel export</button>
  </div>
</div>

<div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
